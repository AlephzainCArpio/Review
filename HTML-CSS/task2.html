<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Box Model Card</title>

  <style>
    body {
      margin: 0;
    }

    .card {
      width: 300px;
      height: 200px;
      border: 2px solid black;
      padding: 20px;

      margin: 100px auto;
      box-sizing: border-box;
    }

    .card h2 {
      margin-bottom: 10px;
    }

    .card p {
      margin: 0;
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>Hi</h2>
    <p>
      My name is Alephzain and I am 24 years old. And this is just a greetings card.
    </p>
  </div>

</body>
</html>
