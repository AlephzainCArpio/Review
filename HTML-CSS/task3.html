<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flexbox Navbar</title>

  <style>
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 10px 20px;
      border-bottom: 2px solid black;
    }

    .logo {
      font-weight: bold;
      font-size: 20px;
    }

    .nav-links {
      display: flex;
      gap: 20px;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .nav-links a {
      text-decoration: none;
      color: black;
    }
  </style>
</head>

<body>

  <nav class="navbar">
    <div class="logo">MyLogo</div>

    <ul class="nav-links">
      <li><a href="#home">Home</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

</body>
</html>
